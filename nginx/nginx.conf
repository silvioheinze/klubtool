limit_req_zone $binary_remote_addr zone=attachment_upload:10m rate=10r/m;

log_format attachment_upload_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method /uploads/attachments/[redacted] $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream main {
    server app:8000;
}

server {
    listen 80;

    client_max_body_size 100M;

    location /uploads/attachments/ {
        client_max_body_size 25m;
        limit_req zone=attachment_upload burst=3 nodelay;
        access_log /var/log/nginx/access.log attachment_upload_safe;

        proxy_pass http://main;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://main;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /usr/src/app/staticfiles/;
    }

    location /media/ {
        alias /usr/src/app/media/;
    }
}
