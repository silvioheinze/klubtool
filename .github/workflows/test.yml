name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  POSTGRES_DB: klubtool_test
  POSTGRES_USER: klubtooluser
  POSTGRES_PASSWORD: klubtoolpassword
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: klubtool_test
          POSTGRES_USER: klubtooluser
          POSTGRES_PASSWORD: klubtoolpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U klubtooluser -d klubtool_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpq-dev \
            libxml2-dev \
            libxslt-dev \
            libffi-dev \
            zlib1g-dev \
            libjpeg-dev \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libgobject-2.0-0 \
            libglib-2.0-0 \
            shared-mime-info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: app
        run: python manage.py test --noinput --verbosity=1
